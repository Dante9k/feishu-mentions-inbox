services:
  app:
    init: true
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mentions.db}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:${APP_PORT:-8090}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; port=os.getenv('APP_PORT','8090'); urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - mentions_sqlite:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 20s

volumes:
  mentions_sqlite:
